[project]
name = "station"
version = "0.1.0"
description = "Station of One: an hourly machine-edited newscast built on a Fly.io Sprite"
requires-python = ">=3.13"
dependencies = ["jinja2>=3.1"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ffmpeg: needs ffmpeg/ffprobe (run on the Sprite)"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["station"]
