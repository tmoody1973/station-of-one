{# One player bar for the whole site (site shell, decision 010). Never inside <main>, so page swaps never touch it. #}
<div class="player" id="wone-player" data-default='{{ (player_default or {}) | tojson }}'><div class="wrap">
  <audio id="wone-audio" preload="none"></audio>
  <button class="play" id="wone-play" aria-label="Play"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18"><path id="wone-icon" d="M4 2l12 7-12 7z" fill="#fff"/></svg></button>
  <div class="now"><span class="label" id="wone-label">{{ (player_default or {}).get("label") or "ONE 1.0 FM" }}</span><span class="chapter" id="wone-now">Press play</span><span class="msg" id="wone-msg" hidden></span></div>
  <div class="bar" id="wone-bar" role="progressbar" aria-label="Position"><div id="wone-fill"></div></div>
  <span class="time" id="wone-time">0:00</span>
  <button class="skip" data-skip="-15" aria-label="Back 15 seconds">−15s</button>
  <button class="skip" data-skip="15" aria-label="Forward 15 seconds">+15s</button>
  <button class="ctl station-only" id="wone-skip-song" aria-label="Skip this song">Skip</button>
  <button class="ctl station-only" id="wone-live" aria-label="Back to live">Back to live</button>
  <div class="embed" id="wone-embed" hidden></div>
</div></div>
<script src="/shell.js" defer></script>
